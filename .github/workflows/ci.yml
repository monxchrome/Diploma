name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: apps/ai-service
        run: uv sync --group dev

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate production Compose and build hardened images
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.prod.yml config
          docker compose --env-file .env.production -f docker-compose.prod.yml build web api ai-service

  production-deployment-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm manual deployment handoff
        run: echo "Deploy only from an approved protected environment using the documented VM procedure."
